name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential make python3-dev

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python make

      - name: Build and test
        if: runner.os != 'Windows'
        run: make clean && make && make test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make clean && make

      - name: Test lexer (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-lexer

      - name: Test parser (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-parser

      - name: Test compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-compile

      - name: Test CLI (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test-cli
