name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential make python3-dev

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-zip make

      - name: Build and test
        if: runner.os != 'Windows'
        run: make clean && make && make test

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make clean && make && make test

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf "dist/simpl-${version}-linux-x64.tar.gz" simpl README.md LICENSE CHANGELOG.md docs examples
          else
            tar -czf "dist/simpl-${version}-macos.tar.gz" simpl README.md LICENSE CHANGELOG.md docs examples
          fi

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          version="${GITHUB_REF_NAME#v}"
          cp simpl.exe README.md LICENSE CHANGELOG.md "$package_dir/"
          cp -r docs examples "$package_dir/"
          ldd ./simpl.exe | awk '/=> \/ucrt64\/bin\// { print $3 }' | while read -r library; do
            cp "$library" "$package_dir/"
          done
          (cd "$package_dir" && zip -r "$GITHUB_WORKSPACE/dist/simpl-${version}-windows.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  extension:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce and package extension
        run: |
          npm install --global @vscode/vsce
          cd editors/vscode
          vsce package --out "$RUNNER_TEMP/simpl-0.1.0.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: release-vscode-extension
          path: ${{ runner.temp }}/simpl-0.1.0.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
